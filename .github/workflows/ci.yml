name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-style-and-pure-unit:
    name: PHP Style + Pure Unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, intl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run code style check (Pint)
        run: ./vendor/bin/pint --test

      - name: Run pure unit tests
        run: ./vendor/bin/phpunit --testsuite PureUnit

  php-backend-integration:
    name: PHP Backend Integration
    runs-on: ubuntu-latest
    needs: php-style-and-pure-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, intl, pdo, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run backend integration suite when DB migrations exist
        run: |
          if [ -d database/migrations ] && [ "$(ls -A database/migrations)" ]; then
            cp .env.example .env
            php artisan key:generate --force
            ./vendor/bin/phpunit --testsuite BackendIntegration
          else
            echo "No migrations found, skipping BackendIntegration suite."
          fi

  php-backend-feature:
    name: PHP Backend Feature
    runs-on: ubuntu-latest
    needs: php-style-and-pure-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, intl, pdo, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run backend feature suite when DB migrations exist
        run: |
          if [ -d database/migrations ] && [ "$(ls -A database/migrations)" ]; then
            cp .env.example .env
            php artisan key:generate --force
            ./vendor/bin/phpunit --testsuite BackendFeature
          else
            echo "No migrations found, skipping BackendFeature suite."
          fi

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t pmo-app:${{ github.sha }} .
